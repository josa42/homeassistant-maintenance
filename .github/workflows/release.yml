name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.3, or major, minor or patch
        required: true
        default: patch

jobs:
  # The same checks as every push, on the commit being released.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    uses: josa42/actions/.github/workflows/shared-ha-release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      version_files: |
        custom_components/maintenance/__init__.py: CARD_VERSION = "{version}"
        custom_components/maintenance/www/maintenance-card.js: const CARD_VERSION = "{version}"
